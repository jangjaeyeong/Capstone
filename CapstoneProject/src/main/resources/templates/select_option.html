<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select_Option</title>
  <link rel="stylesheet" href="../CSS/select_option.css">
</head>
<body>
  <header>
    <h1>개발자 스택 추천</h1>
    <p>당신의 목표에 맞는 기술 스택을 추천해드립니다.</p>
  </header>
  
  <main>
    <section class="form-section">
      <h2>목표 선택</h2>
      <select id="goalSelect">
        <option value="">-- 목표를 선택하세요 --</option>
        <option value="frontend">프론트엔드 개발자</option>
        <option value="backend">백엔드 개발자</option>
        <option value="fullstack">풀스택 개발자</option>
        <option value="ai">AI/머신러닝 엔지니어</option>
        <option value="mobile">모바일 앱 개발자</option>
        <option value="security">정보보안 전문가</option>
      </select>
      <button onclick="recommendStack()">추천받기</button>
    </section>

    <section id="resultSection" class="result-section">
      <h2>추천 결과</h2>
      <div id="result"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 DevStack Guide. All rights reserved.</p>
  </footer>

  <script src="/js/mainpage.js"></script>
</body>
</html>
