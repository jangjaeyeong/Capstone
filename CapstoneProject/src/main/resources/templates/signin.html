<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGN IN</title>
  <link rel="stylesheet" href="/CSS/signin.css">
</head>
<body>
  <div class="wrapper">
    <div class="title-text">
      <div class="title login">SIGN IN</div>
      <div class="title signup">SIGN UP</div>
    </div>
    <div class="form-container">
      <div class="slide-controls">
        <input type="radio" name="slide" id="login" checked>
        <input type="radio" name="slide" id="signup">
        <label for="login" class="slide login">SIGN IN</label>
        <label for="signup" class="slide signup">SIGN UP</label>
        <div class="slider-tab"></div>
      </div>
      <div class="form-inner">
        <form action="/login" method="post" class="login">
          <div class="field">
            <input name="userID" type="text" placeholder="ID" required>
          </div>
          <div class="field">
            <input name="userPassword" type="password" placeholder="Password" required>
          </div>
          <div class="pass-link"><a href="forget_account.html">Forgot password?</a></div>
          <div class="field-remember-id">
            <input type="checkbox" id="remember-id">
            <label for="remember-id">Remember ID</label>
          </div>
          <div th:if="${param.error}">
            <h4>아이디나 비밀번호가 틀렸습니다.</h4>
          </div>
          <div class="field btn">
            <div class="btn-layer">
            <input type="submit" value="SIGN IN">
            </div>
          </div>
          <div class="signup-link">Not a member? <a href="">Sign up now</a></div>
        </form>


        <form action="/userInsert" method="post" class="signup">
          <div class="field">
            <input name="name" type="text" placeholder="name" required>
          </div>
          <div class="field">
            <input name="userId" type="text" placeholder="ID" required>
          </div>
          <div class="field">
            <input name="profileName" type="text" placeholder="NickName" required>
          </div>
          <div class="field">
            <input name="password" type="password" placeholder="Password" required>
          </div>
          <div class="field">
            <input name="confirmPassword" type="password" placeholder="Confirm password" required>
          </div>
          <div class="field">
            <input name="cellphone" type="text" placeholder="- 제외하고 입력해주세요" required>
          </div>
          <div class="field btn">
            <div class="btn-layer">
            <input type="submit" value="Signup">
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <script src="/js/signin.js"></script>
</body>
</html>
